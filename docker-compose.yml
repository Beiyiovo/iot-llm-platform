services:
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: iot_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456" ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: iot-app
    ports:
      - "8080:8080"
      - "1883:1883"
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: "123456"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/iot_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      # 挂了 Key 就把 provider 改成 dashscope，否则走本地规则诊断
      AI_PROVIDER: mock
      DASHSCOPE_API_KEY: ""
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
